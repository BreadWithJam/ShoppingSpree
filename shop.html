<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Shop the latest products at ShoppingSpree. Thousands of items at unbeatable prices.">
  <title>Shop | ShoppingSpree</title>

  <!-- Preload critical resources -->
  <link rel="preload" href="styles.css" as="style">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="shop-page">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Site Header -->
  <header class="site-header" role="banner">
    <div class="site-header__container">
      <div class="site-header__brand">
        <a href="/" class="site-header__logo" aria-label="ShoppingSpree Homepage">
          <span class="logo-text">ShoppingSpree</span>
        </a>
      </div>

      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav-menu">
        <span class="nav-toggle__line"></span>
        <span class="nav-toggle__line"></span>
        <span class="nav-toggle__line"></span>
      </button>

      <nav class="site-header__navigation" role="navigation" aria-label="Main navigation">
        <ul class="nav-menu">
          <li class="nav-menu__item">
            <a href="/" class="nav-menu__link">Home</a>
          </li>
          <li class="nav-menu__item">
            <a href="/shop" class="nav-menu__link" aria-current="page">Shop</a>
          </li>
          <li class="nav-menu__item">
            <a href="/deals" class="nav-menu__link">Deals</a>
          </li>
          <li class="nav-menu__item">
            <a href="/about" class="nav-menu__link">About</a>
          </li>
          <li class="nav-menu__item">
            <a href="/contact" class="nav-menu__link">Contact</a>
          </li>
        </ul>
      </nav>

      <div class="site-header__actions">
        <div class="search-component">
          <form class="search-form" role="search">
            <input type="search" class="search-input" placeholder="Search products...">
            <button type="submit" class="search-button">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.35-4.35" />
              </svg>
            </button>
          </form>
        </div>
        <div class="cart-component">
          <button class="cart-button" aria-label="Shopping cart">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1" />
              <circle cx="20" cy="21" r="1" />
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
            </svg>
            <span class="cart-count">0</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main id="main-content" class="shop-main">
    <div class="shop-container">
      <!-- Shop Sidebar -->
      <aside class="filter-sidebar" role="complementary" aria-label="Product filters">
        <div class="filter-group">
          <h3 class="filter-group__title">Categories</h3>
          <ul class="filter-list">
            <li><button class="filter-button is-active" data-filter="all">All Categories</button></li>
            <li><button class="filter-button" data-filter="electronics">Electronics</button></li>
            <li><button class="filter-button" data-filter="fashion">Fashion</button></li>
            <li><button class="filter-button" data-filter="home">Home & Living</button></li>
            <li><button class="filter-button" data-filter="sports">Sports</button></li>
          </ul>
        </div>

        <div class="filter-group">
          <h3 class="filter-group__title">Price Range</h3>
          <ul class="filter-list">
            <li><button class="filter-button" data-price="0-50">Under $50</button></li>
            <li><button class="filter-button" data-price="50-100">$50 to $100</button></li>
            <li><button class="filter-button" data-price="100-500">$100 to $500</button></li>
            <li><button class="filter-button" data-price="500+">$500 & Above</button></li>
          </ul>
        </div>

        <div class="filter-group">
          <h3 class="filter-group__title">Customer Rating</h3>
          <ul class="filter-list">
            <li><button class="filter-button" data-rating="4">4 Stars & Above</button></li>
            <li><button class="filter-button" data-rating="3">3 Stars & Above</button></li>
          </ul>
        </div>
      </aside>

      <!-- Shop Content Area -->
      <div class="shop-content">
        <header class="shop-content__header">
          <h1 class="shop-title">Our <span class="shop-title__highlight">Products</span></h1>
          <div class="shop-controls">
            <span class="product-count">Showing <span id="current-count">0</span> products</span>
            <div class="sort-dropdown">
              <label for="sort-select" class="visually-hidden">Sort by</label>
              <select id="sort-select" class="sort-select">
                <option value="featured">Featured</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
                <option value="rating">Best Rating</option>
              </select>
            </div>
          </div>
        </header>

        <ul class="shop-product-grid" id="product-grid">
          <!-- Products will be injected here via JavaScript -->
          <div class="loading-spinner" aria-label="Loading products"></div>
        </ul>

        <div class="pagination" id="pagination">
          <!-- Pagination will be injected here -->
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="site-footer__container">
      <p class="site-footer__copyright">
        &copy; 2026 ShoppingSpree. Built with love. |
        <a href="/privacy" class="site-footer__link">Privacy</a> &middot;
        <a href="/terms" class="site-footer__link">Terms</a>
      </p>
    </div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>

</html>
